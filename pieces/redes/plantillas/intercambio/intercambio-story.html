<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>El intercambio · story</title>
<!-- Plantilla de story y portada de reel: 1080 × 1920. El registro «Pregunta y cifra»: la imagen es la conversación.
     Render: ../../_base/render.sh intercambio-story.html 1080 1920 salida.png
     Con guías: render.sh "intercambio-story.html?guias" 1080 1920 salida-guias.png
     Todo lo que importa vive en .contenido, entre y = 285 e y = 1248: ahí no lo tapa la interfaz
     de la story ni la del reel, y sobrevive al recorte 4:5 del feed y al 3:4 de la grilla.
     El pie va abajo, dentro de la zona de story; en un reel lo tapa la leyenda (el @ ya lo muestra Instagram).
     Va siempre sobre el negro y, como en el feed, sin titular de dos líneas ni foto. -->
<link rel="stylesheet" href="../../_base/brand.css">
<link rel="stylesheet" href="../_comun/plantilla.css">
<link rel="stylesheet" href="intercambio.css">
<script>if (new URLSearchParams(location.search).has('guias')) document.documentElement.classList.add('guias');</script>
<style>
  :root { --ancho: 1080px; --alto: 1920px; }
  .marco { top: 285px; right: 72px; bottom: 340px; left: 72px; }
  .contenido { display: flex; flex-direction: column; height: 963px; }
  /* Los mismos textos que el feed entran en los 963 px de .contenido: por eso la pregunta, la cifra
     y el aire van un poco más chicos que en el feed. */
  .contexto { margin-bottom: 40px; font-size: 28px; }
  .intercambio { display: flex; flex-direction: column; margin-block: auto; }
  .pregunta { font-size: 72px; }
  .trabajo { margin-top: 28px; font-size: 28px; }
  .cifra { margin-top: 28px; }
  .cifra-numero { font-size: 240px; }
  .cifra-unidad { font-size: 42px; }
  .filas { margin-top: 28px; font-size: 32px; }
  .filas div { padding: 12px 0; }
  .ok { margin-top: 24px; font-size: 36px; }
  .nota { margin-top: 24px; font-size: 26px; }
  .pie { margin-top: auto; }
  .lockup { --logo-alto: 56px; }
  .handle { font-size: 30px; }
</style>
</head>
<body>
<!-- Glifos de estado. Cada uno va con su palabra: «listo» en la línea de la tool, «Espera tu OK» en el pedido. -->
<svg width="0" height="0" style="position: absolute;" aria-hidden="true">
  <symbol id="te-toca" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.25" fill="currentColor"/></symbol>
  <symbol id="resuelto" viewBox="0 0 10 10"><path d="M1.6 5.4 4 7.8 8.6 2.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
</svg>

<main class="marco" data-bloque="marco">
  <div class="contenido" data-bloque="contenido">
    <p class="contexto" data-bloque="contexto">
      <!-- EDITAR: la línea de contexto, el tema en 1 a 3 palabras, sin punto. Máximo 26 caracteres. Va en tinta y el CSS la pasa a mayúsculas.
           Sin «iris» (saldría «IRIS») y sin «Mercado Libre» (capítulo 12: va, si hace falta, en la nota). -->
      <span data-slot="contexto">Precios</span>
      <!-- EDITAR: cuándo, si hay una fecha real: «Falta 1 semana», «Hoy». Máximo 16 caracteres. Si no hay, dejalo vacío. Sin urgencia inventada. -->
      <span data-slot="contexto-cuando">Falta 1 semana</span>
    </p>

    <!-- EJEMPLO: la pregunta, la tool, la cifra y las filas son inventadas. Nunca datos reales de un cliente. -->
    <div class="intercambio" data-bloque="intercambio">
      <!-- EDITAR: la pregunta del dueño, en sus palabras y con minúscula inicial, como se tipea en el teléfono. Una sola pregunta.
           Máximo 60 caracteres (3 renglones). El cursor va pegado al final: no se borra. -->
      <p class="pregunta"><span data-slot="pregunta">si bajo 15 % la mochila, ¿cuánto me queda por venta?</span><span class="cursor" aria-hidden="true"></span></p>

      <!-- EDITAR: la tool que leyó la cuenta, con su nombre real (verificalo contra el MCP vigente). Máximo 36 caracteres, en mono.
           Y la hora HH:MM en que terminó. El ✓ y «listo» no se tocan. -->
      <p class="trabajo"><svg class="glifo resuelto"><use href="#resuelto"/></svg><span><span data-slot="tool">listing_prices_scan</span> · listo · <time data-slot="tool-hora">10:40</time></span></p>

      <!-- EDITAR: la respuesta. La cifra, máximo 6 caracteres contando el punto de miles y el signo («6.100», «−1.300»).
           La unidad o lo que la cifra cuenta, terminada en punto: máximo 34 caracteres. Entra al lado de la cifra si la cifra
           tiene hasta 5 caracteres y la unidad unos 10 («por venta.»); si no entra, baja sola debajo de la cifra. -->
      <p class="cifra"><b class="cifra-numero" data-slot="cifra">6.100</b><span class="cifra-unidad" data-slot="cifra-unidad">por venta.</span></p>

      <!-- EDITAR: dos filas de contexto de la cifra. Etiqueta máximo 30 caracteres; valor máximo 18 (una cifra, o «antes → después»). -->
      <dl class="filas">
        <div><dt data-slot="fila-1-etiqueta">Hoy te quedan</dt><dd data-slot="fila-1-valor">9.200</dd></div>
        <div><dt data-slot="fila-2-etiqueta">Tu mínimo</dt><dd data-slot="fila-2-valor">5.000</dd></div>
      </dl>

      <!-- EDITAR: sólo si la respuesta termina en una decisión del dueño. La pregunta de vuelta, corta: máximo 26 caracteres.
           El ● y «Espera tu OK.» no se tocan. Si no hay nada que decidir, se borra el <p class="ok"> entero: el ● nunca va sin decisión. -->
      <p class="ok"><svg class="glifo te-toca"><use href="#te-toca"/></svg><span><span data-slot="ok-pregunta">¿La bajo?</span> Espera tu OK.</span></p>
    </div>

    <!-- EDITAR: dejala mientras las cifras sean inventadas. Máximo 40 caracteres. -->
    <p class="nota" data-slot="nota">Datos de ejemplo.</p>
  </div>

  <footer class="pie" data-bloque="pie">
    <span class="lockup" aria-label="iris agents">
      <span class="icono signature" aria-hidden="true">i</span>
      <span class="wordmark signature">iris agents</span>
    </span>
    <span class="handle">@iris_agents</span>
  </footer>
</main>

<!-- Guías: sólo se ven con ?guias.
     Story: 250 px arriba, 340 abajo y 64 por lado (pedido de marca).
     Reel: Meta pide dejar libre el 14 % de arriba, el 35 % de abajo y el 6 % de cada lado (269, 672 y 65 px)
       (facebook.com/business/ads-guide/update/video/instagram-reels).
     Reel en el feed: se recorta a 4:5, los 1350 px del centro (y 285 a 1635).
     Grilla del perfil: 3:4 desde enero de 2025, los 1440 px del centro (y 240 a 1680) (hopperhq.com/blog/instagram-reel-size). -->
<i class="guia etiqueta-abajo-fuera" data-etiqueta="story · 250 arriba · 340 abajo · 64 por lado" style="left: 64px; top: 250px; width: 952px; height: 1330px;"></i>
<i class="guia punteada etiqueta-abajo-fuera" data-etiqueta="reel (Meta) · 14 % arriba · 35 % abajo · 6 % por lado" style="left: 65px; top: 269px; width: 950px; height: 979px;"></i>
<i class="guia etiqueta-abajo-fuera etiqueta-derecha" data-etiqueta="reel en el feed · 4:5" style="left: 0; top: 285px; width: 1080px; height: 1350px;"></i>
<i class="guia punteada etiqueta-abajo-fuera etiqueta-derecha" data-etiqueta="grilla del perfil · 3:4" style="left: 0; top: 240px; width: 1080px; height: 1440px;"></i>
</body>
</html>
