<main class="cover">
  <!-- EDITAR: pictograma de «Permisos» (un interruptor prendido). Un solo SVG de trazo, sin texto
       (el nombre lo escribe Instagram abajo). Grilla 24×24, dibujar entre 2 y 22; el grosor
       lo fija destacada.css (--pictogram-stroke, no se pone stroke-width acá); los puntos
       llenos llevan class="dot". Si se agranda o achica para compensarlo a ojo, cambiar sólo
       --pictogram-box y no pasar de 560px: la zona segura es un círculo de Ø720. -->
  <svg class="pictogram" data-slot="pictograma" viewBox="0 0 24 24" role="img" aria-label="Permisos: un interruptor prendido">
    <rect x="2" y="6" width="20" height="12" rx="6"/>
    <circle class="dot" cx="16" cy="12" r="3"/>
  </svg>
