<!doctype html>

<body>
<!-- Portada de la destacada «Demo» · 1080×1920. Render: ../../_base/render.sh destacada-demo.html 1080 1920 destacada-demo.png
     Versión con guías: la misma plantilla con ?guias (destacada-demo.html?guias). -->
<main class="cover">
  <!-- EDITAR: pictograma de «Demo» (una pantalla con el botón de reproducir). Un solo SVG de trazo, sin texto
       (el nombre lo escribe Instagram abajo). Grilla 24×24, dibujar entre 2 y 22; el grosor
       lo fija destacada.css (--pictogram-stroke, no se pone stroke-width acá); los puntos
       llenos llevan class="dot". Si se agranda o achica para compensarlo a ojo, cambiar sólo
       --pictogram-box y no pasar de 560px: la zona segura es un círculo de Ø720. -->
  <!-- La pantalla lleva pie: sin él, un rectángulo redondeado con el triángulo se lee como el logo de YouTube. -->
  <svg class="pictogram" data-slot="pictograma" style="--pictogram-box: 492px" viewBox="0 0 24 24" role="img" aria-label="Demo: una pantalla con el botón de reproducir">
    <rect x="2" y="3.5" width="20" height="13" rx="3"/>
    <path d="M10.5 7.25 15 10 10.5 12.75Z"/>
    <path d="M12 16.5v4M9 20.5h6"/>
  </svg>
</main>
</body>
</html>
