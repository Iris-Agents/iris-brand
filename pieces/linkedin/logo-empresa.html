<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Logo de la página de LinkedIn</title>
<!--
  Logo de la página de empresa «Iris Agents» en LinkedIn: logo/icon.svg a 400 × 400, la medida
  recomendada por la ayuda de LinkedIn (mínimo 268 × 268). Es el ícono a sangre, con la i a 0,64
  del lado: va cuadrado, sin esquinas horneadas ni transparencia, y LinkedIn pone el resto.
  Render: ../redes/_base/render.sh logo-empresa.html 400 400 "$PWD/logo-empresa-400.png"
  La página va en blanco, como en los exportes de logo/: si el cuadrado no llegara al borde, se notaría.
  NO EDITAR: no tiene textos editables. Si cambia logo/icon.svg, se vuelve a renderizar.
-->
<style>
  html, body { margin: 0; width: 400px; height: 400px; overflow: hidden; background: #fff; }
  img { display: block; width: 400px; height: 400px; }
</style>
</head>
<body>
<img src="../../logo/icon.svg" width="400" height="400" alt="iris agents">
</body>
