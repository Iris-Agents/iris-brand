<!-- @dsCard group="Superficies" width=960 height=464 subtitle="Vidrio ahumado, sólo en la capa que flota: la barra y el panel" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Glass</title>
<style>
  html { font-synthesis: none; }
  body { margin: 0; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .vidrio { display: grid; gap: var(--space-6); padding: var(--space-6); }
  .escenas { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--space-6); }
  .escena { display: grid; gap: var(--space-3); margin: 0; }
  .rotulo, .nota { margin: 0; }
  .rotulo { color: var(--text-tertiary); }
  .nota { max-width: 640px; color: var(--text-secondary); }
  /* El marco de captura: lo de adentro es el contenido que se mueve detrás del vidrio. */
  .marco { position: relative; height: 312px; overflow: hidden; background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-frame); }

  /* Detrás de la barra: el titular de la landing, con la primera línea pasando por abajo. */
  .detras-barra { position: absolute; top: 36px; left: var(--space-5); right: var(--space-5); display: grid; gap: var(--space-4); }
  .titular { margin: 0; }
  .titular > span { display: block; white-space: nowrap; }
  .primera { color: var(--text-primary); }
  .segunda { font-style: italic; color: var(--text-secondary); }
  .bajada { margin: 0; color: var(--text-secondary); }

  .barra { position: absolute; top: var(--space-4); left: var(--space-4); right: var(--space-4); display: flex; align-items: center; gap: var(--space-5); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); border-radius: var(--radius-panel); }
  .logo { display: block; height: 28px; width: auto; }
  .logo-claro { display: none; }
  [data-theme="light"] .logo-oscuro { display: none; }
  [data-theme="light"] .logo-claro { display: block; }
  .enlace { margin-left: auto; color: var(--text-secondary); text-decoration: none; }

  /* Detrás del panel: el feed, que sigue moviéndose. */
  .detras-panel { position: absolute; top: var(--space-6); left: var(--space-6); width: 320px; margin: 0; padding: 0; list-style: none; }
  .fila { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: 11px 0; border-top: 1px solid var(--border-subtle); }
  .fila:first-child { border-top: 0; }
  .que { color: var(--text-secondary); }
  .que b { font-weight: 500; color: var(--text-primary); }
  .glifo { display: block; flex: none; width: 10px; height: 10px; overflow: visible; }
  .te-toca { color: var(--status-attention); }
  .trabajando { color: var(--status-working); }
  .resuelto { color: var(--status-done); }

  .panel { position: absolute; top: var(--space-16); right: var(--space-6); width: 300px; display: grid; gap: var(--space-4); padding: var(--space-5); border-radius: var(--radius-panel); }
  .cabeza { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .eyebrow { margin: 0; text-transform: uppercase; color: var(--text-tertiary); }
  .pildora { display: inline-flex; align-items: center; height: var(--space-6); padding: 0 10px; border: 1px solid var(--border-control); border-radius: var(--radius-pill); white-space: nowrap; color: var(--text-primary); }
  .panel h3 { margin: 0; color: var(--text-primary); }
  .panel dl { display: grid; margin: 0; }
  .panel dl div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-4); padding: 9px 0; border-top: 1px solid var(--border-subtle); }
  .panel dt { color: var(--text-secondary); }
  .panel dd { margin: 0; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text-primary); }
  .acciones { display: flex; flex-wrap: wrap; gap: var(--space-2); }

  .boton { display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-control); white-space: nowrap; text-decoration: none; cursor: pointer; }
  .boton:focus-visible, .enlace:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .comodo { height: var(--size-control-comfortable); padding: 0 var(--space-4); }
  .denso { height: var(--size-control-dense); padding: 0 var(--space-3); }
  .lleno { background: var(--action-primary); color: var(--text-on-action); border: 1px solid var(--action-primary); }
  .ghost { background: transparent; color: var(--text-primary); border: 1px solid var(--border-default); }

  /* La receta de css/glass.css. Sin soporte de backdrop-filter: el nivel 2 liso. */
  .glass-bar, .glass-panel { background-color: var(--bg-raised); border: 1px solid var(--border-default); }
  /* glass.blur (24 px) y glass.saturate (1,4) son de iris-brand y no viajan como token: van escritos. */
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    .glass-bar, .glass-panel {
      border-color: var(--glass-rim);
      box-shadow: inset 0 1px 0 var(--glass-specular); /* luz, no sombra */
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      backdrop-filter: blur(24px) saturate(1.4);
    }
    .glass-bar { background-color: var(--glass-bar); }
    .glass-panel { background-color: var(--glass-panel); }
  }
  @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
    .glass-bar, .glass-panel { background-color: var(--bg-raised); border-color: var(--border-default); box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (forced-colors: active) {
    .glass-bar, .glass-panel { background-color: Canvas; border-color: CanvasText; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
</style>
</head>
<body>
<div class="vidrio">
  <div class="escenas">
    <figure class="escena">
      <figcaption class="rotulo copy-ui"><span class="mono">glass-bar</span> · la barra que flota, en la landing</figcaption>
      <div class="marco">
        <div class="detras-barra" aria-hidden="true">
          <p class="titular">
            <span class="primera headline-section-first">Agentes expertos</span>
            <span class="segunda headline-section-second">a cargo de tu e-commerce.</span>
          </p>
          <p class="bajada copy-body">Atienden a tus clientes y manejan tu cuenta de punta a punta, con la autonomía que vos le das.</p>
        </div>
        <nav class="glass-bar barra" aria-label="Principal">
          <img class="logo logo-oscuro" src="/_blob/08e43705d59305c2324e72531e4e1e4a" alt="iris agents" height="28">
          <img class="logo logo-claro" src="/_blob/e0a9a07c8e0433c87d127bf4d8f58083" alt="iris agents" height="28">
          <a class="enlace label" href="#precios">Precios</a>
          <a class="boton comodo lleno label" href="#conectar">Conectá tu cuenta</a>
        </nav>
      </div>
    </figure>
    <figure class="escena">
      <figcaption class="rotulo copy-ui"><span class="mono">glass-panel</span> · la aprobación cuando flota, en la app</figcaption>
      <div class="marco">
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
          <symbol id="te-toca" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.25" fill="currentColor"/></symbol>
          <symbol id="trabajando" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 1a4 4 0 0 1 0 8z" fill="currentColor"/></symbol>
          <symbol id="resuelto" viewBox="0 0 10 10"><path d="M1.6 5.4 4 7.8 8.6 2.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
        </svg>
        <ul class="detras-panel" aria-hidden="true">
          <li class="fila copy-ui"><svg class="glifo te-toca"><use href="#te-toca"/></svg><span class="que">Reponer <b>Mochila urbana 22 L</b></span></li>
          <li class="fila copy-ui"><svg class="glifo trabajando"><use href="#trabajando"/></svg><span class="que">Revisa <b>el precio del ganador</b></span></li>
          <li class="fila copy-ui"><svg class="glifo resuelto"><use href="#resuelto"/></svg><span class="que">Contestó <b>40 preguntas</b></span></li>
          <li class="fila copy-ui"><svg class="glifo resuelto"><use href="#resuelto"/></svg><span class="que">Resolvió <b>3 reclamos</b></span></li>
          <li class="fila copy-ui"><svg class="glifo resuelto"><use href="#resuelto"/></svg><span class="que">Generó <b>3 ventas adicionales</b></span></li>
          <li class="fila copy-ui"><svg class="glifo resuelto"><use href="#resuelto"/></svg><span class="que">Adhirió a <b>una promoción</b></span></li>
        </ul>
        <article class="glass-panel panel" aria-label="Propuesta">
          <div class="cabeza">
            <span class="eyebrow">Propuesta</span>
            <span class="pildora label">Espera tu OK</span>
          </div>
          <h3 class="title">Reponer Mochila urbana 22 L</h3>
          <dl class="copy-ui">
            <div><dt>Stock publicado</dt><dd>3 → 43</dd></div>
            <div><dt>Leído</dt><dd>hoy · <time class="mono">10:40</time></dd></div>
          </dl>
          <div class="acciones">
            <button type="button" class="boton denso lleno label">Aprobar</button>
            <button type="button" class="boton denso ghost label">Rechazar con motivo</button>
          </div>
        </article>
      </div>
    </figure>
  </div>
  <p class="nota copy-ui">Sólo en lo que flota sobre contenido que se mueve: la barra de la landing, ⌘K sin cortina, popovers y menús, la aprobación cuando flota. Nunca en el contenido ni en una pieza estática, nunca vidrio sobre vidrio, nunca más de dos a la vez.</p>
</div>
</body>
</html>
