<!-- @dsCard group="Piezas" height=368 subtitle="El panel «Hoy en tu cuenta»: lo que te toca arriba, lo resuelto abajo" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Feed</title>
<style>
  html { font-synthesis: none; }
  body { margin: 0; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .lienzo { padding: var(--space-6); }
  .feed { display: grid; gap: 10px; max-width: 440px; padding: 18px var(--space-5) 14px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-panel); }
  .eyebrow { margin: 0; text-transform: uppercase; color: var(--text-tertiary); }
  .feed ul { margin: 0; padding: 0; list-style: none; }
  .fila { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: var(--space-3); align-items: center; padding: 11px 0; border-top: 1px solid var(--border-subtle); }
  .fila:first-child { border-top: 0; }
  /* Cada fila es un resultado: lo que cambió va en <b>, en primario 500; el resto, en secundario. */
  .que { color: var(--text-secondary); }
  .que b { font-weight: 500; color: var(--text-primary); }
  .en-curso { white-space: nowrap; color: var(--text-tertiary); }
  .pildora { display: inline-flex; align-items: center; height: var(--space-6); padding: 0 10px; border: 1px solid var(--border-control); border-radius: var(--radius-pill); white-space: nowrap; color: var(--text-primary); }
  .glifo { display: block; flex: none; width: 10px; height: 10px; overflow: visible; }
  .te-toca { color: var(--status-attention); }
  .trabajando { color: var(--status-working); }
  .resuelto { color: var(--status-done); }
  .leyenda { display: flex; flex-wrap: wrap; gap: var(--space-1) 14px; margin: 0; padding-top: 10px; border-top: 1px solid var(--border-subtle); color: var(--text-tertiary); }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div class="lienzo">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="te-toca" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.25" fill="currentColor"/></symbol>
    <symbol id="trabajando" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 1a4 4 0 0 1 0 8z" fill="currentColor"/></symbol>
    <symbol id="resuelto" viewBox="0 0 10 10"><path d="M1.6 5.4 4 7.8 8.6 2.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  </svg>
  <section class="feed" aria-label="Hoy en tu cuenta">
    <p class="eyebrow">Hoy en tu cuenta</p>
    <ul>
      <li class="fila copy-ui">
        <svg class="glifo te-toca" aria-hidden="true"><use href="#te-toca"/></svg>
        <span class="que">Reponer <b>Mochila urbana 22 L</b></span>
        <span class="pildora label">Espera tu OK</span>
      </li>
      <li class="fila copy-ui">
        <svg class="glifo trabajando" aria-hidden="true"><use href="#trabajando"/></svg>
        <span class="que">Revisa <b>el precio del ganador</b></span>
        <span class="en-curso">en curso</span>
      </li>
      <li class="fila copy-ui">
        <svg class="glifo resuelto" aria-hidden="true"><use href="#resuelto"/></svg>
        <span class="que">Contestó <b>40 preguntas</b></span>
      </li>
      <li class="fila copy-ui">
        <svg class="glifo resuelto" aria-hidden="true"><use href="#resuelto"/></svg>
        <span class="que">Resolvió <b>3 reclamos</b></span>
      </li>
      <li class="fila copy-ui">
        <svg class="glifo resuelto" aria-hidden="true"><use href="#resuelto"/></svg>
        <span class="que">Generó <b>3 ventas adicionales</b></span>
      </li>
    </ul>
    <p class="leyenda copy-ui">
      <span><svg class="glifo te-toca" aria-hidden="true"><use href="#te-toca"/></svg>te toca</span>
      <span><svg class="glifo trabajando" aria-hidden="true"><use href="#trabajando"/></svg>trabajando</span>
      <span><svg class="glifo resuelto" aria-hidden="true"><use href="#resuelto"/></svg>resuelto</span>
    </p>
  </section>
</div>
</body>
</html>
